# Release：仅在推送 tag（v*）时发布到 npm
# - 不在 push 到 main 时发布
# - 需在仓库 Settings > Secrets and variables > Actions 配置 NPM_TOKEN
#   创建位置：https://www.npmjs.com/settings/你的用户名/tokens/new
#   选 Classic Token，勾选 Publish 权限（或 Granular 指向 dsh-superpower）

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # setup-node 会写入占位符 //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # 此步骤在 setup-node 之后净化 NPM_TOKEN，写入 NODE_AUTH_TOKEN 与 ~/.npmrc
      # 需兼容：BOM、CR/LF、首尾空白、首尾引号/反引号、控制字符、内部空白
      - name: 净化 NPM_TOKEN 并注入认证
        env:
          RAW_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$RAW_TOKEN" ]; then
            echo "::error::NPM_TOKEN 未配置"
            echo "::error::请到 https://www.npmjs.com/settings/__TOKEN__/tokens/new 创建 Classic Publish Token，"
            echo "::error::然后在 GitHub 仓库 Settings > Secrets and variables > Actions 中添加 NPM_TOKEN"
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          let raw = process.env.RAW_TOKEN || '';
          // 去 BOM、去 CR/LF、trim、去首尾引号/反引号
          let clean = raw.replace(/^\uFEFF/, '').replace(/[\r\n]/g, '').trim();
          clean = clean.replace(/^["'`]+|["'`]+$/g, '').trim();
          // 去控制字符与内部空白（HTTP header 非法字符的常见来源）
          clean = clean.replace(/[\x00-\x1F\x7F]/g, '').replace(/\s+/g, '');
          if (!clean) {
            console.error('::error::NPM_TOKEN 净化后为空，请检查 Secrets 是否粘贴了换行/空白');
            process.exit(1);
          }
          if (!/^npm_[A-Za-z0-9_\-]+$/.test(clean) && clean.length < 20) {
            console.warn(`::warning::NPM_TOKEN 格式异常（长度 ${clean.length}），请确认是 npm Access Token（应以 npm_ 开头）`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `NODE_AUTH_TOKEN=${clean}\n`);
          const npmrc = path.join(os.homedir(), '.npmrc');
          fs.writeFileSync(npmrc, `//registry.npmjs.org/:_authToken=${clean}\nregistry=https://registry.npmjs.org/\n`);
          console.log(`NPM_TOKEN 已净化（长度 ${clean.length}）并写入 NODE_AUTH_TOKEN 与 ~/.npmrc`);
          NODE
          echo "已写入 ~/.npmrc（脱敏预览）："
          sed 's/:_authToken=.*/:_authToken=***/' ~/.npmrc

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: node scripts/verify.mjs

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_VER=$(node -p "require('./package.json').version")
          EXPECT="${TAG#v}"
          if [ "$PKG_VER" != "$EXPECT" ]; then
            echo "::error::tag $TAG 与 package.json version $PKG_VER 不一致"
            exit 1
          fi
          echo "版本一致: $TAG -> $PKG_VER"

      - name: 校验 npm 认证有效
        run: npm whoami --registry https://registry.npmjs.org

      - name: 发布到 npm
        run: npm publish --access public

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
