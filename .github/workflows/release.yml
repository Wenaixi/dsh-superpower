# Release：仅在推送 tag（v*）时发布到 npm 并自动创建 GitHub Release
# 正文自动从 CHANGELOG.md 提取对应版本段落，并附带指向 CHANGELOG 的链接
# - 不在 push 到 main 时发布
# - 需在仓库 Settings > Secrets and variables > Actions 配置 NPM_TOKEN

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # setup-node 会写入占位符 //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # 此步骤在 setup-node 之后净化 NPM_TOKEN，写入 NODE_AUTH_TOKEN 与 ~/.npmrc
      - name: 净化 NPM_TOKEN 并注入认证
        env:
          RAW_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$RAW_TOKEN" ]; then
            echo "::error::NPM_TOKEN 未配置"
            echo "::error::请到 https://www.npmjs.com/settings/__TOKEN__/tokens/new 创建 Classic Publish Token，"
            echo "::error::然后在 GitHub 仓库 Settings > Secrets and variables > Actions 中添加 NPM_TOKEN"
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          let raw = process.env.RAW_TOKEN || '';
          let clean = raw.replace(/^\uFEFF/, '').replace(/[\r\n]/g, '').trim();
          clean = clean.replace(/^["'`]+|["'`]+$/g, '').trim();
          clean = clean.replace(/[\x00-\x1F\x7F]/g, '').replace(/\s+/g, '');
          if (!clean) {
            console.error('::error::NPM_TOKEN 净化后为空，请检查 Secrets 是否粘贴了换行/空白');
            process.exit(1);
          }
          if (!/^npm_[A-Za-z0-9_\-]+$/.test(clean) && clean.length < 20) {
            console.warn(`::warning::NPM_TOKEN 格式异常（长度 ${clean.length}），请确认是 npm Access Token（应以 npm_ 开头）`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `NODE_AUTH_TOKEN=${clean}\n`);
          const npmrc = path.join(os.homedir(), '.npmrc');
          fs.writeFileSync(npmrc, `//registry.npmjs.org/:_authToken=${clean}\nregistry=https://registry.npmjs.org/\n`);
          console.log(`NPM_TOKEN 已净化（长度 ${clean.length}）并写入 NODE_AUTH_TOKEN 与 ~/.npmrc`);
          NODE
          echo "已写入 ~/.npmrc（脱敏预览）："
          sed 's/:_authToken=.*/:_authToken=***/' ~/.npmrc

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: node scripts/verify.mjs

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_VER=$(node -p "require('./package.json').version")
          EXPECT="${TAG#v}"
          if [ "$PKG_VER" != "$EXPECT" ]; then
            echo "::error::tag $TAG 与 package.json version $PKG_VER 不一致"
            exit 1
          fi
          echo "版本一致: $TAG -> $PKG_VER"

      - name: 校验 npm 认证有效
        run: npm whoami --registry https://registry.npmjs.org

      - name: 发布到 npm
        run: npm publish --access public

      # 为 -dsh.N 系列显式打 dsh dist-tag，避免被默认的 latest 抢占。
      # 见 CLAUDE.md 第 10 章 "dist-tag 策略"。
      - name: 为 -dsh.N 系列打 dsh dist-tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          if echo "$VER" | grep -Eq -- "6\.3\.0-dsh\.[0-9]+$"; then
            echo "为 $VER 显式打 dsh dist-tag"
            npm dist-tag add "@wenaixi/dsh-superpower@$VER" dsh
          else
            echo "$VER 不是 -dsh.N 形态，跳过 dsh dist-tag"
          fi

      - name: 解析 CHANGELOG 段落
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # 本项目 -dsh.N 为基线上的正式演进线，不应标为 GitHub pre-release；
          # 仅当后缀不是 -dsh.N 时才按 semver 视为预发布
          if echo "$VER" | grep -Eq -- "-dsh\.[0-9]+$"; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif echo "$VER" | grep -q "-"; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          node <<'NODE'
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const tag = process.env.GITHUB_REF.replace('refs/tags/', '');
          const ver = tag.replace(/^v/, '');
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          // 稳健提取：定位标题行后手动切片到下一标题，避免 \z 等无效锚点在含 z 字符时截断
          const escVer = ver.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const headerRe = new RegExp(`^## \\[${escVer}\\].*`, 'm');
          const headerMatch = changelog.match(headerRe);
          let body = '';
          if (headerMatch && headerMatch.index !== undefined) {
            const start = headerMatch.index;
            const rest = changelog.slice(start);
            const nextIdx = rest.slice(headerMatch[0].length).search(/^## \[/m);
            const section = nextIdx === -1 ? rest : rest.slice(0, headerMatch[0].length + nextIdx);
            body = section.trim();
            const lines = body.split('\n');
            lines.shift();
            body = lines.join('\n').trim();
            if (!body) body = section.trim();
          } else {
            body = `未在 CHANGELOG.md 中找到 ${tag} 的段落，请查看完整更新日志。`;
          }
          const repo = process.env.GITHUB_REPOSITORY || 'Wenaixi/dsh-superpower';
          const changelogUrl = `https://github.com/${repo}/blob/${tag}/CHANGELOG.md`;
          const header = `> 更新内容详见 [CHANGELOG.md](${changelogUrl})\n\n`;
          const full = header + body + `\n\n---\n\n**完整更新日志**: [CHANGELOG.md](${changelogUrl})`;
          const outDir = process.env.RUNNER_TEMP || os.tmpdir();
          const outPath = path.join(outDir, 'release_body.md');
          fs.writeFileSync(outPath, full);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `body_path=${outPath}\n`);
          // 供后续 step 调试预览（脱敏）
          console.log('--- release body preview (first 500 chars) ---');
          console.log(full.slice(0, 500));
          console.log(`body_path=${outPath}`);
          NODE

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          prerelease: ${{ steps.changelog.outputs.prerelease == 'true' }}
          draft: false
          generate_release_notes: false
