# Release：仅在推送 tag（v*）时发布到 npm
# - 不在 push 到 main 时发布
# - 需在仓库 Settings > Secrets and variables > Actions 配置 NPM_TOKEN
#   NPM_TOKEN 为 npm Access Token（classic 或 granular，勾选 publish 权限）

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: node scripts/verify.mjs

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_VER=$(node -p "require('./package.json').version")
          # 去掉 tag 前缀 v 后应与 package.json 完全一致
          EXPECT="${TAG#v}"
          if [ "$PKG_VER" != "$EXPECT" ]; then
            echo "::error::tag $TAG 与 package.json version $PKG_VER 不一致"
            exit 1
          fi
          echo "版本一致: $TAG -> $PKG_VER"

      - name: 校验 NPM_TOKEN 已配置
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN 未配置，请在仓库 Settings > Secrets and variables > Actions 中设置 npm Access Token（classic 或 granular，需 publish 权限）"
            exit 1
          fi
          TRIMMED="$(echo -n "$NPM_TOKEN" | tr -d '\r\n' | xargs)"
          LEN=${#TRIMMED}
          if [ "$LEN" -lt 10 ]; then
            echo "::error::NPM_TOKEN 长度异常（${LEN}），请检查是否粘贴完整"
            exit 1
          fi
          echo "NPM_TOKEN 已配置，长度 ${LEN} 字符"

      - name: 配置 npm 认证（消毒 header 非法字符）
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TOKEN="$(echo -n "$NPM_TOKEN" | tr -d '\r\n' | xargs)"
          # 覆盖 setup-node 生成的占位符，显式写入 sanitized token，避免 header 非法字符
          echo "//registry.npmjs.org/:_authToken=${TOKEN}" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          echo "已写入 ~/.npmrc"
          cat ~/.npmrc | sed 's/:_authToken=.*/:_authToken=***/'

      - name: 发布到 npm
        run: npm publish --access public --provenance false

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
